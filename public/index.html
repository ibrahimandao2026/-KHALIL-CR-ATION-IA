    body {

      height: 100vh;

    .app {

    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;

    }

      display: flex;

    }

    .dot {

      background: #63ff8c;
      border-radius: 50%;
    }

    .chat {

      background: #f5f7f6;
    }

    }

    }

      font-size: 16px;
      font-weight: normal;
    }
