<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUNU AI 🇸🇳</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      max-width: 900px;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    /* EN-TÊTE */
    .header {
      background: #00853f;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .header h1 {
      font-size: 21px;
    }

    .header p {
      font-size: 13px;
      margin-top: 4px;
      opacity: 0.9;
    }

    /* ZONE DE DISCUSSION */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px;
      background: #f7f8f8;
    }

    .welcome {
      text-align: center;
      padding: 45px 15px;
    }

    .welcome-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      color: #00853f;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
      line-height: 1.5;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #00853f;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .message.ai .bubble {
      background: white;
      color: #222;
      border: 1px solid #ddd;
      border-bottom-left-radius: 5px;
    }

    /* SUGGESTIONS */
    .suggestions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 12px;
      background: white;
      border-top: 1px solid #eee;
    }

    .suggestion {
      flex-shrink: 0;
      border: 1px solid #00853f;
      background: white;
      color: #00853f;
      border-radius: 20px;
      padding: 9px 13px;
      font-size: 13px;
    }

    /* ZONE DE SAISIE */
    .input-area {
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 25px;
      padding: 13px 16px;
      font-size: 15px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #00853f;
    }

    .btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .voice-btn {
      background: #f4c300;
    }

    .send-btn {
      background: #00853f;
      color: white;
    }

    .voice-btn.listening {
      background: #d62828;
      color: white;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.08);
      }
    }

    .status {
      text-align: center;
      min-height: 18px;
      margin-top: 5px;
      font-size: 12px;
      color: #777;
    }

    @media (min-width: 901px) {
      body {
        padding: 20px;
      }

      .app {
        height: calc(100vh - 40px);
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 25px rgba(0,0,0,0.12);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- EN-TÊTE -->
  <header class="header">
    <div class="logo">🇸🇳</div>

    <div>
      <h1>SUNU AI</h1>
      <p>Votre assistant intelligent sénégalais</p>
    </div>
  </header>


  <!-- DISCUSSION -->
  <main class="chat" id="chat">

    <div class="welcome" id="welcome">

      <div class="welcome-icon">🇸🇳</div>

      <h2>Bienvenue sur SUNU AI</h2>

      <p>
        Je suis votre assistant intelligent.<br>
        Écrivez-moi ou utilisez votre voix 🎙️
      </p>

    </div>

  </main>


  <!-- SUGGESTIONS -->
  <div class="suggestions">

    <button
      class="suggestion"
      onclick="useSuggestion('Je cherche un stage en géomatique à Dakar.')">
      🎓 Stage en géomatique
    </button>

    <button
      class="suggestion"
      onclick="useSuggestion('Aide-moi à créer mon CV.')">
      📄 Mon CV
    </button>

    <button
      class="suggestion"
      onclick="useSuggestion('Aide-moi à rédiger une lettre de motivation.')">
      ✍️ Lettre de motivation
    </button>

    <button
      class="suggestion"
      onclick="useSuggestion('Donne-moi des conseils pour mes études.')">
      📚 Études
    </button>

  </div>


  <!-- SAISIE -->
  <div class="input-area">

    <div class="input-row">

      <input
        id="messageInput"
        type="text"
        placeholder="Écrivez votre message..."
        autocomplete="off"
      >

      <button
        id="voiceBtn"
        class="btn voice-btn"
        title="Parler">
        🎙️
      </button>

      <button
        id="sendBtn"
        class="btn send-btn"
        title="Envoyer">
        ➤
      </button>

    </div>

    <div id="status" class="status"></div>

  </div>

</div>


<script>

  const chat = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const voiceBtn = document.getElementById("voiceBtn");
  const status = document.getElementById("status");
  const welcome = document.getElementById("welcome");


  /* AJOUTER UN MESSAGE */
  function addMessage(text, type) {

    welcome.style.display = "none";

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }


  /* ENVOYER LE MESSAGE */
  async function sendMessage() {

    const message = input.value.trim();

    if (!message) {
      return;
    }

    addMessage(message, "user");

    input.value = "";

    status.textContent = "SUNU AI réfléchit...";

    sendBtn.disabled = true;

    try {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })

      });


      const data = await response.json();


      if (!response.ok) {
        throw new Error(
          data.error || "Erreur du serveur."
        );
      }


      const reply =
        data.reply ||
        "Je n'ai pas pu générer une réponse.";


      addMessage(reply, "ai");

      speak(reply);


    } catch (error) {

      console.error(error);

      addMessage(
        "Désolé, une erreur est survenue. Vérifie la connexion à SUNU AI.",
        "ai"
      );

    } finally {

      status.textContent = "";

      sendBtn.disabled = false;

      input.focus();

    }
  }


  /* SUGGESTION */
  function useSuggestion(text) {

    input.value = text;

    input.focus();

  }


  /* TOUCHE ENTRÉE */
  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  });


  sendBtn.addEventListener("click", sendMessage);


  /* RECONNAISSANCE VOCALE */

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  let recognition = null;


  if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "fr-FR";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = function() {

      voiceBtn.classList.add("listening");

      status.textContent = "🎙️ Je vous écoute...";

    };


    recognition.onresult = function(event) {

      const text =
        event.results[0][0].transcript;

      input.value = text;

      status.textContent = "";

    };


    recognition.onerror = function() {

      status.textContent =
        "Impossible d'utiliser le microphone.";

      voiceBtn.classList.remove("listening");

    };


    recognition.onend = function() {

      voiceBtn.classList.remove("listening");

      status.textContent = "";

    };


    voiceBtn.addEventListener("click", function() {

      try {

        recognition.start();

      } catch (error) {

        console.log(error);

      }

    });

  } else {

    voiceBtn.addEventListener("click", function() {

      alert(
        "La reconnaissance vocale n'est pas disponible sur ce navigateur."
      );

    });

  }


  /* LECTURE VOCALE */

  function speak(text) {

    if (!("speechSynthesis" in window)) {
      return;
    }

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "fr-FR";

    utterance.rate = 0.95;

    utterance.pitch = 1;

    window.speechSynthesis.speak(utterance);

  }

</script>

</body>
 </html>
