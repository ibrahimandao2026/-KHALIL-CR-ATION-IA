<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌍KHALIl🇸🇳CRÉATION🇸🇳IA</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f5;margin:0;color:#172033}
main{max-width:850px;margin:auto;padding:20px}
header{background:#087f55;color:#fff;padding:25px;border-radius:20px}
h1{margin:0}.sub{opacity:.9;margin-top:7px}
.card{background:#fff;padding:18px;border-radius:18px;margin-top:16px;box-shadow:0 5px 20px #0001}
#chat{min-height:280px;display:flex;flex-direction:column;gap:10px}
.b{padding:12px 14px;border-radius:15px;max-width:85%;white-space:pre-wrap;line-height:1.45}
.ai{background:#edf7f2;align-self:flex-start}.me{background:#eaf0ff;align-self:flex-end}
.row{display:flex;gap:8px;margin-top:15px}input{flex:1;padding:13px;border:1px solid #dce2e8;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:12px 16px;background:#087f55;color:#fff;font-weight:700;cursor:pointer}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.quick button{background:#eef2f4;color:#233}
small{color:#687386}
</style>
 <style>
  body {
    background-image:
      linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
      url("fond.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }
 </style>
</head>
<body>
<main>
<header><h1>🌍KHALIL🇸🇳CRÉATION🇸🇳IA</h1><div class="sub">Ton assistant intelligent pensé pour le Sénégal.</div></header>
<section class="card"><div id="chat"><div class="b ai">Bonjour 👋🏾 Je suis SUNU AI. Pose-moi une question.</div></div>
<div class="row"><input id="msg" placeholder="Écris ta question..."><button onclick="send()">Envoyer</button></div>
<div class="quick">
<button onclick="quick('Aide-moi à créer un CV professionnel.')">📄 CV</button>
<button onclick="quick('Écris une lettre de motivation pour un stage.')">✉️ Lettre</button>
<button onclick="quick('Comment préparer un entretien d’embauche ?')">🎯 Entretien</button>
</div><br><small>La clé API reste sur le serveur et n'est jamais envoyée au navigateur.</small>
</section>
</main>
<script>
const input=document.getElementById('msg'), chat=document.getElementById('chat');
function add(t,c){const d=document.createElement('div');d.className='b '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function send(){
 const q=input.value.trim(); if(!q)return;
 add(q,'me');input.value='';
 add('SUNU AI réfléchit…','ai'); const loading=chat.lastChild;
 try{
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});
   const data=await r.json(); loading.remove(); add(data.reply||data.error||'Erreur.','ai');
 }catch(e){loading.remove();add('Erreur de connexion au serveur.','ai')}
}
function quick(q){input.value=q;send()}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
